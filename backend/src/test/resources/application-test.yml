# Test profile: in-memory H2 (MySQL compatibility mode). No MySQL needed to run `mvn test`.
spring:
  datasource:
    url: jdbc:h2:mem:campuscare_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
app:
  upload-dir: target/test-uploads
  seed-demo-data: true
